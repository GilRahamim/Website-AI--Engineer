name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: kb-app/.nvmrc
          cache: npm
          cache-dependency-path: kb-app/package-lock.json

      - name: Install dependencies
        working-directory: kb-app
        run: npm ci

      - name: Typecheck
        working-directory: kb-app
        run: npm run typecheck

      - name: Lint
        working-directory: kb-app
        run: npm run lint

      - name: Test
        working-directory: kb-app
        run: npm run test

      - name: Build
        working-directory: kb-app
        run: npm run build

      # The SPA fallback lives in wrangler.jsonc (Cloudflare's current
      # Workers-assets flow), not in a _redirects file — see docs/DEPLOY.md.
      - name: Verify SPA fallback config
        working-directory: kb-app
        run: grep -q '"not_found_handling": "single-page-application"' wrangler.jsonc
